name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Quality gate. Runs on pull requests too, so a regression is caught before
  # it reaches main rather than after it has already been published.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22: jsdom, @testing-library/jest-dom and undici all declare
      # engines >=22, and package-lock.json is generated with npm 10.9.x.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build:
    # Gate the deploy: if typecheck or tests fail, nothing is published.
    needs: verify
    # Skip publishing for pull requests — verify still runs on them.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only the static frontend is deployed to Pages. server.ts (Socket.IO +
      # Gemini proxy) is NOT part of this build — those features stay disabled
      # in the UI until that backend is hosted separately.
      # See VITE_ENABLE_SERVER_FEATURES in .env.example.
      - run: npm run build:web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
